name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: dusklang/dusk
          path: dusk
      - uses: actions/checkout@v3
        with:
          repository: zachwolfe/display_adapter
          path: display_adapter
      - name: Build
        run: rustup update && cd dusk && cargo build --verbose
      - name: Run tests
        env:
          DUSK_SRC_ROOT: ${{ github.workspace }}/dusk
        run: |
          cd dusk
          cargo run -- test-compiler
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: dusklang/dusk
          path: dusk
      - uses: actions/checkout@v3
        with:
          repository: zachwolfe/display_adapter
          path: display_adapter
      - name: Build
        run: rustup update && cd dusk && cargo build --verbose
      - name: Run tests
        env:
          DUSK_SRC_ROOT: ${{ github.workspace }}/dusk
        run: |
          cd dusk
          cargo run -- test-compiler
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: dusklang/dusk
          path: dusk
      - uses: actions/checkout@v3
        with:
          repository: zachwolfe/display_adapter
          path: display_adapter
      - name: Build
        run: rustup update && cd dusk && cargo build --verbose
      - name: Run tests
        env:
          DUSK_SRC_ROOT: ${{ github.workspace }}/dusk
        run: |
          cd dusk
          cargo run -- test-compiler
